# Build check on every push/PR. (Cloudflare Pages does its own production build;
# this catches type errors early and on branches.)
name: CI
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}   # re-run on demand (e.g. after a GitHub Actions outage eats a run)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build first, so a type error is always reported. This used to sit *after*
      # npm audit, which meant a newly-published advisory in someone else's package
      # both failed an unrelated push and hid the type-check signal this workflow
      # exists for (run 31109006954, 6 Aug 2026 -- a react-router advisory published
      # overnight turned main red with no code change).
      - run: npm run build

      # Advisories are reported but never gate the build: whether main is green must
      # depend on our code, not on the advisory database's clock. The weekly
      # security-audit workflow is what makes sure nothing here goes unnoticed.
      - name: npm audit (advisory report, non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
